name: Build CAKE qdisc + tc for the running BE550 (SQM without reflash)

# The router's kernel has NET_SCHED but not NET_CLS / NET_CLS_ACT (those are =y
# options that kmod-sched-core would add, changing the kernel). sch_cake builds
# as a plain module without them, so it is compiled out-of-tree against the
# router's exact kernel config. Shaping plan: cake on wan egress (upload) and
# on br-lan egress (download) -- no ifb/mirred needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kmod-cake.yml'

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_SHA: 5dbd340d123552d245d068c198b0c369758fc340
  # kernel=6.18.55~<hash> from the router's /etc/apk/world
  ROUTER_VERMAGIC: 3b5b3d18a1e30df089238e078a1c8d89
  # module vermagic string the router's own modules carry
  ROUTER_MOD_VERMAGIC: "6.18.55 SMP mod_unload aarch64"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - uses: actions/checkout@v4

      - name: Fetch OpenWrt at the router's revision
        run: |
          git init openwrt && cd openwrt
          git remote add origin "$OPENWRT_REPO"
          git fetch --depth 1 origin "$OPENWRT_SHA"
          git checkout -q "$OPENWRT_SHA"
          git log -1 --format='%H %s'

      - name: Feeds and config (router's installed packages, no extras)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../router-match.diffconfig .config
          make defconfig
          ! grep -q '^CONFIG_PACKAGE_kmod-sched-core=' .config

      - name: Build toolchain and kernel
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          make -j$(($(nproc)+1)) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install
          make -j$(($(nproc)+1)) target/linux/compile || make -j1 V=s target/linux/compile

      - name: Check kernel fingerprint
        run: |
          cd openwrt
          LD=$(ls -d build_dir/target-*/linux-qualcommbe_ipq95xx/linux-6.* | head -1)
          VM=$(cat build_dir/target-*/linux-qualcommbe_ipq95xx/linux-*/.vermagic 2>/dev/null | head -1)
          echo "built vermagic:  $VM"
          echo "router vermagic: $ROUTER_VERMAGIC"
          mkdir -p ../out
          echo "$VM" > ../out/vermagic.txt
          grep -E '^CONFIG_NET_SCHED=|^CONFIG_NET_CLS=|^CONFIG_NET_CLS_ACT=|^CONFIG_NET_SCH_CAKE|^CONFIG_NF_CONNTRACK=|^CONFIG_MODVERSIONS|^CONFIG_MODULE_SIG' $LD/.config | tee ../out/kernel-config.txt || true
          echo "LD=$LD" >> $GITHUB_ENV
          if [ "$VM" = "$ROUTER_VERMAGIC" ]; then echo MATCH > ../out/match.txt; else echo "MISMATCH $VM" > ../out/match.txt; fi
          cat ../out/match.txt

      - name: Build sch_cake out-of-tree against that kernel
        run: |
          cd openwrt
          TC=$(ls -d staging_dir/toolchain-aarch64_*_musl | head -1)
          export STAGING_DIR=$PWD/staging_dir PATH=$PWD/$TC/bin:$PWD/staging_dir/host/bin:$PATH
          mkdir -p ../ext && cp $LD/net/sched/sch_cake.c ../ext/
          echo 'obj-m := sch_cake.o' > ../ext/Makefile
          make -C $LD ARCH=arm64 CROSS_COMPILE=aarch64-openwrt-linux-musl- M=$PWD/../ext modules
          cp ../ext/sch_cake.ko ../out/
          cd ../out
          aarch64-openwrt-linux-musl-strip --strip-debug sch_cake.ko 2>/dev/null || $GITHUB_WORKSPACE/openwrt/$TC/bin/aarch64-openwrt-linux-musl-strip --strip-debug sch_cake.ko
          strings sch_cake.ko | grep -E '^(vermagic|depends|name)='
          strings sch_cake.ko | grep -q "^vermagic=$ROUTER_MOD_VERMAGIC"

      - name: Build tc (iproute2) after the kernel is done
        run: |
          cd openwrt
          echo 'CONFIG_PACKAGE_tc-tiny=y' >> .config
          make defconfig
          make -j$(($(nproc)+1)) package/libs/libmnl/compile package/network/utils/iproute2/compile || make -j1 V=s package/network/utils/iproute2/compile
          T=$(find build_dir/target-* -path '*iproute2*' -name tc -type f -perm -u+x | grep -v ipkg | head -1)
          echo "tc: $T"; test -n "$T"
          cp "$T" ../out/tc
          file ../out/tc
          readelf -d ../out/tc | grep NEEDED | tee ../out/tc-needs.txt

      - name: Checksums
        run: |
          cd out && sha256sum sch_cake.ko tc > sha256sums.txt && cat sha256sums.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cake-sqm
          path: out/
